<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Tools — Max</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e8ecf1;
    --muted: #9aa3b2;
    --accent: #c96442;
    --accent-2: #e07a5c;
    --chip: #232832;
    --chip-active: #c96442;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius: 14px;
  }
  body.light {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f0f2f6;
    --border: #dfe3ea;
    --text: #1a1d23;
    --muted: #5b6474;
    --accent: #c96442;
    --accent-2: #a94f32;
    --chip: #eef1f5;
    --chip-active: #c96442;
    --shadow: 0 6px 18px rgba(20,24,40,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 24px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
  .title-block h1 { font-size: 28px; margin: 0 0 6px 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .title-block h1 .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .title-block p { margin: 0; color: var(--muted); font-size: 14px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .icon-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .icon-btn:hover { background: var(--panel-2); }

  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
  .search { flex: 1; min-width: 220px; position: relative; }
  .search input {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px; background: var(--chip); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 12px; cursor: pointer; user-select: none;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--chip-active); color: white; border-color: var(--chip-active); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: all 0.15s;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    min-height: 180px;
    position: relative;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .card-emoji {
    font-size: 22px; margin-bottom: 10px;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border-radius: 10px;
  }
  .card h3 { margin: 0 0 6px 0; font-size: 16px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 3px 7px; background: var(--panel-2); color: var(--muted);
    border-radius: 4px; font-weight: 500;
  }
  .open-btn {
    font-size: 12px; font-weight: 500; color: var(--accent);
    display: flex; align-items: center; gap: 4px;
  }
  .card:hover .open-btn { color: var(--accent-2); }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--muted); background: var(--panel);
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty-state h2 { color: var(--text); margin: 0 0 8px 0; font-size: 18px; }
  .empty-state p { margin: 0; font-size: 14px; }

  footer {
    margin-top: 50px; padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px; display: flex;
    justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { color: var(--accent-2); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1><span class="dot"></span> My Tools</h1>
      <p id="subtitle">A personal hub of HTML tools.</p>
    </div>
    <div class="controls">
      <button class="icon-btn" id="themeToggle" title="Toggle light/dark">Theme</button>
    </div>
  </header>

  <div class="filter-bar">
    <div class="search">
      <input type="text" id="searchInput" placeholder="Search tools…" />
    </div>
    <div class="chips" id="tagFilters">
      <!-- filter chips injected -->
    </div>
  </div>

  <div id="grid" class="grid"><!-- cards injected --></div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <h2>No tools match</h2>
    <p>Try clearing the search or filter.</p>
  </div>

  <footer>
    <span>Powered by Cloudflare Pages</span>
    <span>Last updated <span id="updatedAt">—</span></span>
  </footer>

</div>

<script>
/* =========================================================
   Theme
   ========================================================= */
const THEME_KEY = "mypages_theme";
(function initTheme(){
  if (localStorage.getItem(THEME_KEY) === "light") document.body.classList.add("light");
  document.getElementById("themeToggle").addEventListener("click", () => {
    document.body.classList.toggle("light");
    localStorage.setItem(THEME_KEY, document.body.classList.contains("light") ? "light" : "dark");
  });
})();

/* =========================================================
   Load tool manifest and render
   ========================================================= */
let state = { tools: [], activeTag: "all", query: "" };

async function loadTools(){
  try {
    const res = await fetch("tools.json", { cache: "no-cache" });
    const data = await res.json();
    state.tools = data.tools || [];
    if (data.updated) document.getElementById("updatedAt").textContent = data.updated;
    if (data.subtitle) document.getElementById("subtitle").textContent = data.subtitle;
    renderFilters();
    render();
  } catch(e) {
    document.getElementById("grid").innerHTML =
      '<div class="empty-state"><h2>Couldn\'t load tools.json</h2><p>Make sure tools.json is in the repo root next to index.html.</p></div>';
  }
}

function renderFilters(){
  const tags = new Set();
  state.tools.forEach(t => (t.tags || []).forEach(tag => tags.add(tag)));
  const container = document.getElementById("tagFilters");
  container.innerHTML = "";
  const makeChip = (label, value) => {
    const c = document.createElement("span");
    c.className = "chip" + (state.activeTag === value ? " active" : "");
    c.textContent = label;
    c.addEventListener("click", () => { state.activeTag = value; renderFilters(); render(); });
    return c;
  };
  container.appendChild(makeChip("All", "all"));
  [...tags].sort().forEach(t => container.appendChild(makeChip(t, t)));
}

function render(){
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  const q = state.query.toLowerCase();
  const filtered = state.tools.filter(t => {
    const matchTag = state.activeTag === "all" || (t.tags || []).includes(state.activeTag);
    const matchQ = !q || (t.title + " " + (t.description || "") + " " + (t.tags || []).join(" ")).toLowerCase().includes(q);
    return matchTag && matchQ;
  });

  if (filtered.length === 0) {
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }
  grid.style.display = "grid";
  empty.style.display = "none";

  grid.innerHTML = filtered.map(t => `
    <a class="card" href="${t.path}">
      <div class="card-emoji">${t.emoji || "🔧"}</div>
      <h3>${escapeHtml(t.title)}</h3>
      <p>${escapeHtml(t.description || "")}</p>
      <div class="card-footer">
        <div class="tags">${(t.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        <div class="open-btn">Open →</div>
      </div>
    </a>
  `).join("");
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

document.getElementById("searchInput").addEventListener("input", e => {
  state.query = e.target.value;
  render();
});

loadTools();
</script>
</body>
</html>
